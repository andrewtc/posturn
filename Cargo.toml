[package]
name = "posturn"
description = "Build turn-based games with `async` Rust"
version = "0.4.0"
authors = ["Andrew T. Christensen <andrew@andrewtc.com>"]
edition = "2021"
rust-version = "1.86" # RECOMMENDED: Use `cargo msrv verify` prior to pushing.
